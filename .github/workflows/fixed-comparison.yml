name: Full fixed-action comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 12.6.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install AgentTX 0.3.0
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund agenttx@0.3.0
          test "$(agenttx --version)" = '0.3.0'
      - name: Run all 39 fixed attempts
        run: pnpm run compare:fixed-suite --output-dir "${{ runner.temp }}/twin-fixed-comparison"
      - name: Upload sanitized comparison result
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixed-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/twin-fixed-comparison/comparison.json
            ${{ runner.temp }}/twin-fixed-comparison/comparison.md
          if-no-files-found: warn
          retention-days: 14
